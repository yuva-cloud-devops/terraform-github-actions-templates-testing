# ==============================================================================
# Development Compute Infrastructure Specification (1 VM per environment)
# ==============================================================================

environment: dev
project_id: "yuvaraj-internal-project"
region: "asia-south1"

instances:
  - name: dev-compute-vm-01
    machine_type: e2-medium
    zone: asia-south1-a
    network: default
    enable_public_ip: true          # Public IP enabled via dynamic access_config block
    network_tier: PREMIUM
    tags:
      - web
      - allow-ssh
    labels:
      role: compute
      env: dev
    boot_disk:
      image: debian-cloud/debian-12
      size_gb: 30
      type: pd-balanced
      auto_delete: true
