# ==============================================================================
# Development Compute Infrastructure Specification
# Dynamic Block driven VM definitions: supports Public & Private VM architectures
# ==============================================================================

environment: dev
project_id: "your-gcp-dev-project-id"
region: "us-central1"

instances:
  # ----------------------------------------------------------------------------
  # 1. Public-Facing Web Server (Public IP enabled via dynamic access_config)
  # ----------------------------------------------------------------------------
  - name: dev-web-frontend-01
    machine_type: e2-medium
    zone: us-central1-a
    network: default
    enable_public_ip: true          # Triggers dynamic access_config block creation
    network_tier: PREMIUM
    tags:
      - web
      - allow-ssh
    labels:
      role: frontend
      tier: presentation
    boot_disk:
      image: debian-cloud/debian-12
      size_gb: 30
      type: pd-balanced
      auto_delete: true
    startup_script: |
      #!/bin/bash
      apt-get update && apt-get install -y nginx
      echo "<h1>Hello from Public Web VM (${HOSTNAME})</h1>" > /var/www/html/index.html
      systemctl enable --now nginx

  # ----------------------------------------------------------------------------
  # 2. Private App Server (No Public IP; accessible only via internal VPC mesh)
  # ----------------------------------------------------------------------------
  - name: dev-app-backend-01
    machine_type: e2-standard-2
    zone: us-central1-a
    network: default
    enable_public_ip: false         # access_config block is omitted; Strictly Private
    tags:
      - internal-service
      - allow-ssh
    labels:
      role: backend-api
      tier: application
    boot_disk:
      image: debian-cloud/debian-12
      size_gb: 50
      type: pd-standard
      auto_delete: true

  # ----------------------------------------------------------------------------
  # 3. Private Database Host (Strictly isolated, private IP only)
  # ----------------------------------------------------------------------------
  - name: dev-db-postgres-01
    machine_type: e2-standard-2
    zone: us-central1-b
    network: default
    enable_public_ip: false         # Private only
    tags:
      - internal-service
      - allow-ssh
    labels:
      role: database
      tier: data
    boot_disk:
      image: debian-cloud/debian-12
      size_gb: 100
      type: pd-ssd
      auto_delete: true
